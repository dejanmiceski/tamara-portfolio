<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="footer.css" />

</head>

<body>

    <header class="nav">
        <a href="index.html" class="logo">
            TAMARA <span class="red">STOJKOVSKA</span>
        </a>
        <button class="menu-toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="menu">
            <a href="index.html">HOME</a>
            <a href="music.html">MUSIC</a>
            <a href="index.html#merch" class="merch-link">MERCH</a>
            <a href="cart.html" class="cart-link">
                <img src="images/cart.png" alt="Cart" class="cart-icon">
                <span id="cart-count">0</span>
            </a>
        </nav>
    </header>

    <!-- PRODUCT PAGE -->
    <main class="product-page">

        <!-- LEFT: IMAGE -->
        <div class="product-image-wrapper">
            <button class="image-nav left" id="prev">‹</button>
            <img id="product-image" src="" alt="Product image" />
            <button class="image-nav right" id="next">›</button>
        </div>

        <!-- RIGHT: INFO -->
        <div class="product-info">
            <h1 id="product-title"></h1>

            <div class="sizes" id="sizes"></div>

            <div class="quantity-control">
                <button id="qty-minus">−</button>
                <span id="qty" class="qty-value">1</span>
                <button id="qty-plus">+</button>
            </div>

            <p class="price-price-inline">
                Price: <span id="product-price">0.00</span>
            </p>
            <button id="add-to-cart">ADD TO CART</button>
            <p id="add-to-cart-message" class="add-to-cart-message"></p>


            <div class="product-description">
                <p>
                    This is a limited pre-order item. Each piece is made with care and will
                    be produced after the order period ends. Estimated delivery time will
                    be shared via email.
                </p>
            </div>

            <div class="size-chart">
                <img id="size-chart" src="" alt="Size chart" />
            </div>
        </div>

    </main>

    <script src="script.js"></script>
    <script src="product.js"></script>

    <footer class="site-footer">
            <div class="footer-inner">

                <div class="footer-left">
                    <p>© 2025 Tamara Stojkovska. All rights reserved.</p>
                </div>

                <div class="footer-center">
                    <a href="privacy.html">Privacy Policy</a>
                </div>

                <div class="footer-right footer-social">
                    <svg width="0" height="0" style="position:absolute">
                        <defs>
                            <linearGradient id="instagram-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#833AB4" />
                                <stop offset="100%" stop-color="#FD1D1D" />
                            </linearGradient>
                        </defs>
                    </svg>

                    <!-- Instagram -->
                    <a href="https://instagram.com/tamarastojkovska" target="_blank" aria-label="Instagram">
                        <svg viewBox="0 0 24 24" class="social-icon">
                            <path
                                d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9zm6.5-.9a1.1 1.1 0 1 0 0 2.2a1.1 1.1 0 0 0 0-2.2z" />
                        </svg>
                    </a>

                    <!-- TikTok -->
                    <a href="https://open.spotify.com/artist/5Nx3CHdbm41V16y5Ew7353?si=y1R-tL8WRXSbmbuI1RDu-Q&nd=1"
                        target="_blank" aria-label="Spotify">
                        <svg viewBox="0 0 24 24" class="social-icon">
                            <path
                                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10s10-4.5 10-10S17.5 2 12 2zm4.6 14.4c-.2.3-.6.4-.9.2c-2.5-1.5-5.6-1.9-9.3-1.1c-.4.1-.7-.2-.8-.5c-.1-.4.2-.7.5-.8c4-0.9 7.5-.4 10.3 1.3c.3.2.4.6.2.9zm1.3-2.7c-.2.4-.7.5-1.1.3c-2.9-1.8-7.3-2.3-10.7-1.3c-.4.1-.8-.1-.9-.5c-.1-.4.1-.8.5-.9c3.9-1.1 8.8-.5 12.1 1.6c.4.2.5.7.3 1.1zm.1-2.8c-3.5-2.1-9.2-2.3-12.6-1.3c-.5.1-1-.1-1.1-.6c-.1-.5.1-1 .6-1.1c3.9-1.2 10.2-1 14.2 1.5c.4.2.6.8.4 1.2c-.2.4-.8.6-1.2.4z" />
                        </svg>
                    </a>

                    <!-- YouTube -->
                    <a href="https://www.youtube.com/channel/UClz9nWZGqJsGdAD90wEKtvg" target="_blank"
                        aria-label="YouTube">
                        <svg viewBox="0 0 24 24" class="social-icon">
                            <path
                                d="M21.8 8s-.2-1.5-.8-2.2c-.8-.8-1.7-.8-2.1-.9C16 4.6 12 4.6 12 4.6h0s-4 0-6.9.3c-.4 0-1.3.1-2.1.9C2.4 6.5 2.2 8 2.2 8S2 9.8 2 11.6v.8C2 14.2 2.2 16 2.2 16s.2 1.5.8 2.2c.8.8 1.9.8 2.4.9c1.7.2 6.6.3 6.6.3s4 0 6.9-.3c.4 0 1.3-.1 2.1-.9c.6-.7.8-2.2.8-2.2s.2-1.8.2-3.6v-.8c0-1.8-.2-3.6-.2-3.6zM10 14.8V9.2l5.2 2.8L10 14.8z" />
                        </svg>
                    </a>
                </div>

            </div>
        </footer>

</body>

</html>
