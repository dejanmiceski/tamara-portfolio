<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamara Stojkovska</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />

<body>

    <!-- NAV -->
    <header class="nav">
        <a href="index.html" class="logo">
            TAMARA <span class="red">STOJKOVSKA</span>
        </a>
        <nav class="menu">
            <a href="index.html">HOME</a>
            <a href="#merch" class="merch-link">MERCH</a>
            <a href="cart.html" class="cart-link">
                <img src="images/cart.png" alt="Cart" class="cart-icon">

            </a>
        </nav>

    <section id="home" class="hero">
        <div class="hero-overlay"></div>

        <div class="release">

            <div class="release-artist">TAMARA STOJKOVSKA</div>
            <h1 class="release-title">DA TE SAKAM LESNO E</h1>

            <a href="https://linktr.ee/tamarastojkovska" target="_blank" class="release-button">

            </a>
        </div>
    </section>

    <!-- MERCH -->
    <section id="merch" class="merch">
        <div class="merch-grid">

            <!-- Product 1 -->
            <a href="product.html?id=hoodie-blue" class="product-link">
                <div class="product-card">
                    <div class="product-image">
                        <img src="images/hoodie-blue.png" class="img-back" alt="">
                        <img src="images/hoodie-front.png" class="img-front" alt="">
                    </div>
                    <div class="product-info">
                        <h3>Da te sakam lesno e hoodie</h3>
                        <p class="price">€32,00</p>
                    </div>
                </div>
            </a>

            <!-- Product 2 -->
            <a href="product.html?id=hoodie-pink" class="product-link">
                <div class="product-card">
                    <div class="product-image">
                        <img src="images/hoodie-pink.png" class="img-back" alt="">
                        <img src="images/hoodie-front.png" class="img-front" alt="">
                    </div>
                    <div class="product-info">
                        <h3>Da te sakam lesno e hoodie</h3>
                        <p class="price">€32,00</p>
                    </div>
                </div>
            </a>

            <!-- Product 3 -->
            <a href="product.html?id=tshirt-blue" class="product-link">
                <div class="product-card">
                    <div class="product-image">
                        <img src="images/tshirt-blue.png" class="img-back" alt="">
                        <img src="images/tshirt-front.png" class="img-front" alt="">
                    </div>
                    <div class="product-info">
                        <h3>Da te sakam lesno e tshirt</h3>
                        <p class="price">€20,00</p>
                    </div>
                </div>

            <!-- Product 4 -->

            <a href="product.html?id=tshirt-pink" class="product-link">

                    <div class="product-image">
                        <img src="images/tshirt-pink.png" class="img-back" alt="">
                        <img src="images/tshirt-front.png" class="img-front" alt="">
                    </div>
                    <div class="product-info">
                        <h3>Da te sakam lesno e tshirt</h3>
                        <p class="price">€20,00</p>
                    </div>
                </div>
            </a>

        </div>

    <script src="script.js"></script>

</html>
